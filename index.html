<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<title>Court Strength</title>
<style>
:root{
  --bg:#f5f5f7; --group:#ffffff; --field:#f2f2f7; --fill:#e9e9ee;
  --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6;
  --line:#e3e3e6; --blue:#0071e3; --teal:#00b8a9; --green:#34a853; --red:#d93025;
  --grad:linear-gradient(135deg,#0a84ff 0%,#00c2b2 100%);
  --radius:6px; --shadow:0 1px 3px #00000014;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#000000; --group:#1c1c1e; --field:#2c2c2e; --fill:#2c2c2e;
    --text:#f5f5f7; --text2:#98989d; --text3:#6e6e73; --line:#2f2f31;
    --blue:#0a84ff; --teal:#2ee0cf; --green:#30d158; --red:#ff453a;
    --grad:linear-gradient(135deg,#0a84ff 0%,#2ee0cf 100%); --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Barlow","Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.45;letter-spacing:-0.01em;
  min-height:100vh;min-height:100dvh;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
}
header{padding:calc(14px + env(safe-area-inset-top)) 20px 14px;max-width:620px;margin:0 auto;position:relative;overflow:hidden}
.court{position:absolute;right:-34px;top:-30px;width:250px;height:190px;pointer-events:none;color:var(--blue);opacity:.62;z-index:0;-webkit-mask-image:linear-gradient(to bottom,#000 35%,transparent 96%);mask-image:linear-gradient(to bottom,#000 35%,transparent 96%)}
.court svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;overflow:visible}
.hball{animation:dribble 1.9s cubic-bezier(.3,0,.6,1) infinite;transform-box:fill-box}
@keyframes dribble{0%,100%{transform:translate(68px,124px)}50%{transform:translate(68px,102px)}}
@media (prefers-reduced-motion:reduce){.hball{animation:none}}
.hbar{position:relative;z-index:1}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 11px 4px 8px;border-radius:6px;
  background:var(--group);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;letter-spacing:0;color:var(--text)}
.streak i{font-style:normal;font-size:14px;display:inline-block;animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}45%{transform:scale(1.14) rotate(-6deg)}70%{transform:scale(1.04) rotate(4deg)}}
.streak.cold{color:var(--text2);font-weight:500}
.streak.cold i{animation:none;filter:grayscale(1);opacity:.55}
@media (prefers-reduced-motion:reduce){.streak i,.tick,.banner{animation:none}}
.hbar{display:flex;align-items:center;gap:14px}
.hbar .ht{flex:1;min-width:0}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-0.025em}
.sub{color:var(--text2);font-size:14px;margin-top:1px}
main{padding:8px 16px 24px;max-width:620px;margin:0 auto}

.group{background:var(--group);border-radius:var(--radius);overflow:hidden;margin:14px 0;box-shadow:var(--shadow)}
.gt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:22px 4px 7px}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;position:relative}
.item+.item::before,.sub-sep::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.item .tx{flex:1;min-width:0}
.item .tt{font-size:16.5px;font-weight:500;letter-spacing:-0.012em}
.item .st{font-size:13.5px;color:var(--text2);margin-top:2px;letter-spacing:0}
.chev{color:var(--text3);font-size:15px;flex:none;transition:transform .2s}
.chev.open{transform:rotate(90deg)}
.tick{flex:none;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;font-weight:700;animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.panel{padding:2px 16px 16px;border-top:1px solid var(--line)}

.seg{display:flex;background:var(--fill);border-radius:5px;padding:2px;margin:14px 0 2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-width:72px;border:0;background:none;color:var(--text);font:inherit;font-size:14px;font-weight:500;
  padding:7px 12px;border-radius:4px;white-space:nowrap}
.seg button.on{background:var(--group);font-weight:600;box-shadow:0 1px 3px #0000001f}
@media (prefers-color-scheme:dark){.seg button.on{background:#48484a;box-shadow:none}}

input,select,textarea{width:100%;background:var(--field);color:var(--text);border:1px solid transparent;border-radius:5px;
  padding:11px 12px;font:inherit;font-size:16px;letter-spacing:-0.01em}
input[type=number]{text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
input:focus,select:focus{outline:none;border-color:var(--blue);background:var(--group)}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin:14px 0 5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hrow,.srow{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:9px;align-items:center}
.hrow{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin:14px 0 6px}
.hrow span{text-align:center}
.srow{margin-bottom:8px}
.srow .n{color:var(--text3);text-align:center;font-size:14px;font-variant-numeric:tabular-nums}

.btn{border:0;border-radius:5px;padding:12px 18px;font:inherit;font-size:16px;font-weight:600;letter-spacing:-0.01em;
  background:var(--grad);color:#fff}
.btn.sec{background:var(--fill);color:var(--blue)}
.btn.del{background:var(--fill);color:var(--red)}
.btn.sm{font-size:14px;padding:9px 13px;border-radius:5px}
.btn.x{background:none;color:var(--text3);padding:6px 0;font-size:17px}
.btn:active{opacity:.6;transform:scale(.985)}
.acts{display:flex;gap:9px;margin-top:14px}
.acts .btn{flex:1}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:color-mix(in srgb,var(--group) 94%,transparent);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);
  padding:4px env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav button{position:relative;flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:11.5px;font-weight:700;letter-spacing:0;
  padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px}
nav button svg{position:relative;z-index:1;width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav button span.l{position:relative;z-index:1}
nav button::before{content:"";position:absolute;top:6px;left:50%;width:60px;height:32px;margin-left:-30px;border-radius:8px;
  background:var(--blue);opacity:0;transition:opacity .18s}
nav button.on{color:var(--blue)}
nav button.on::before{opacity:.15}

.note{font-size:14.5px;color:var(--text2);line-height:1.5;margin:12px 0 0;letter-spacing:0}
.empty{text-align:center;color:var(--text2);padding:44px 24px;font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:5px}
.alts{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:none;margin-top:4px}
.alts::-webkit-scrollbar{display:none}
.alt{flex:none;border:1px solid var(--line);background:none;color:var(--text2);font:inherit;font-size:13.5px;
  padding:6px 12px;border-radius:6px;white-space:nowrap}
.alt.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
.dows{display:flex;gap:6px;margin-top:5px}
.dow{flex:1;border:1px solid var(--line);background:none;color:var(--text2);font:inherit;font-size:13px;font-weight:500;
  padding:9px 0;border-radius:5px;text-align:center}
.dow.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--group);border-radius:var(--radius);padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:11.5px;color:var(--text2);letter-spacing:0}
.hrec{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;font-size:15px;position:relative;align-items:center}
.hrec+.hrec::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.hrec .v{color:var(--text2);text-align:right;font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:0}
.dhead{padding:12px 16px 10px;font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.02em;border-bottom:1px solid var(--line)}
.timer{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--grad);color:#fff;
  border:0;border-radius:6px;padding:12px 20px;font:inherit;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  box-shadow:0 6px 20px #0071e355;display:none}
.timer.on{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));
  background:var(--text);color:var(--bg);border-radius:6px;padding:11px 20px;font-size:14.5px;font-weight:500;z-index:60;
  box-shadow:0 8px 24px #0003}
.tpl{padding:14px 16px;position:relative;cursor:pointer}
.tpl+.tpl::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.tpl .tn{font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.tpl .td{font-size:14px;color:var(--text2);margin-top:4px;line-height:1.45;letter-spacing:0}
.tpl .cur{font-size:13px;font-weight:600;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
svg.chart text{fill:var(--text3);font-size:10px;font-family:inherit;letter-spacing:0}
.safety{font-size:14.5px;color:var(--text2);line-height:1.55;letter-spacing:0}
.safety li{margin-bottom:8px}
.safety b{color:var(--text)}

/* progress ring */
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.ring.done .lab{color:var(--teal);font-size:18px}

/* done banner */
.banner{background:var(--grad);color:#fff;border-radius:var(--radius);padding:15px 18px;margin:14px 0;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px #0071e333;animation:rise .4s cubic-bezier(.2,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.banner b{display:block;font-size:16.5px;font-weight:650}
.banner span{font-size:13.5px;opacity:.9;letter-spacing:0}
.banner .em{font-size:26px}

/* drag */
.daygroup{transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.daygroup.dragging{transition:none;z-index:10;position:relative;box-shadow:0 10px 30px #0000002e;opacity:.97}
.handle{flex:none;width:30px;margin-left:-6px;color:var(--text3);font-size:17px;text-align:center;cursor:grab;touch-action:none;
  background:none;border:0;padding:8px 0;line-height:1}
.handle:active{cursor:grabbing;color:var(--blue)}

/* coach quip card */
.coach{display:flex;gap:12px;align-items:center;margin:14px 0;padding:13px 15px;border-radius:var(--radius);cursor:pointer;
  background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 11%,var(--group)),color-mix(in srgb,var(--teal) 14%,var(--group)));box-shadow:var(--shadow)}
.coach .ce{font-size:28px;line-height:1;flex:none;transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.coach:active .ce{transform:rotate(-14deg) scale(1.18)}
.coach .cl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.coach .ct{font-size:15px;line-height:1.38;letter-spacing:-0.005em;font-weight:500}
.coach .ch{font-size:11.5px;color:var(--text2);margin-top:4px;letter-spacing:0}

/* 1% marathon */
.mcard{padding:16px 16px 14px}
.mcard .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mcard .mh b{font-size:16.5px;font-weight:650;letter-spacing:-0.015em}
.mcard .mh span{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;border-radius:5px;background:var(--fill);margin:26px 6px 10px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--grad);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.track .runner{position:absolute;top:-24px;font-size:20px;transform:translateX(-50%);transition:left .6s cubic-bezier(.2,.9,.3,1)}
.track .flag{position:absolute;right:-6px;top:-24px;font-size:18px}
.mcard .mq{font-size:14.5px;color:var(--text2);line-height:1.45;letter-spacing:0;margin-top:12px}
.mcard .mstat{display:flex;gap:8px;margin-top:12px}
.mcard .mstat div{flex:1;background:var(--field);border-radius:5px;padding:9px 10px;text-align:center}
.mcard .mstat b{display:block;font-size:19px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.mcard .mstat span{font-size:11px;color:var(--text2);letter-spacing:0}
.fine{font-size:11.5px;color:var(--text3);margin-top:10px;letter-spacing:0;text-align:center}

/* finish sheet */
.fin .big{font-size:54px;line-height:1;margin:6px 0 8px;animation:bounce .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes bounce{0%{transform:scale(.2) rotate(-25deg);opacity:0}70%{transform:scale(1.18) rotate(6deg)}100%{transform:none;opacity:1}}
.fin h3{margin:0;font-size:24px;font-weight:700;letter-spacing:-0.025em}
.fin .fj{font-size:15.5px;color:var(--text2);line-height:1.45;margin:8px 4px 0;letter-spacing:0}
.fin .fs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.fin .fs div{background:var(--group);border-radius:6px;padding:12px 6px;box-shadow:var(--shadow)}
.fin .fs b{display:block;font-size:20px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.fin .fs span{font-size:11px;color:var(--text2)}
.fin .file{background:var(--group);border-radius:6px;padding:12px 14px;margin:12px 0 4px;text-align:left;font-size:13.5px;line-height:1.5;color:var(--text2);box-shadow:var(--shadow)}
.fin .file b{color:var(--text);font-weight:600}
.confetti{position:fixed;top:-30px;z-index:80;pointer-events:none;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.fin .big{animation:none}}

/* consistency */
.week{padding:14px 14px 12px;margin:14px 0}
.week .wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.week .wh b{font-size:16px;font-weight:650;letter-spacing:-0.015em}
.week .wh span{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk .c{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:0}
.wk .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--text3)}
.wk .done .dot{background:var(--grad);color:#fff;box-shadow:0 3px 9px #0071e340;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.wk .plan .dot{border:2px solid var(--blue);color:var(--blue)}
.wk .miss .dot{border:2px dashed #ff9a3c;color:#ff9a3c}
.wk .rest .dot{background:var(--field);color:var(--text3);font-size:10px}
.wk .today .l{color:var(--blue);font-weight:800}
.wk .today .dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.week .wm{font-size:14px;line-height:1.42;color:var(--text2);margin-top:12px;letter-spacing:0}
.cbars{display:flex;align-items:flex-end;gap:7px;height:96px;margin:14px 2px 4px}
.cbars .cb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.cbars .bar{width:100%;border-radius:4px 4px 3px 3px;background:var(--fill);min-height:5px;transition:height .5s cubic-bezier(.2,.9,.3,1)}
.cbars .bar.full{background:var(--grad)}
.cbars .bar.part{background:color-mix(in srgb,var(--blue) 55%,var(--fill))}
.cbars .bar.low{background:color-mix(in srgb,#ff9a3c 70%,var(--fill))}
.cbars .cl{font-size:10px;color:var(--text3);letter-spacing:0}

/* three-pointer */
svg.shot{display:block;margin:10px 0 0;overflow:visible}
svg.shot text.s3{fill:var(--text3);font-size:9px;font-weight:700;letter-spacing:.06em;font-family:inherit}
svg.shot text.swish{fill:#ff7a1a;font-size:24px;font-weight:800;font-family:inherit;letter-spacing:-0.02em;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
svg.shot.made .net{animation:netjig .7s ease-out;transform-box:fill-box;transform-origin:50% 0}
@keyframes netjig{0%{transform:scaleY(1)}30%{transform:scaleY(1.25) scaleX(.92)}60%{transform:scaleY(.94)}100%{transform:none}}
.rankup{display:inline-block;margin:10px 4px 0;padding:7px 13px;border-radius:6px;background:var(--grad);color:#fff;font-size:13.5px;font-weight:600;letter-spacing:0}


.spot{position:absolute;right:-10px;top:-6px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 66%);pointer-events:none}
.pfig{position:absolute;right:8px;top:4px;width:116px;text-align:center}
.pfig svg{display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.pcap{display:inline-block;margin-top:2px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.14);border-radius:6px;padding:2px 9px;color:#f6d79b}
/* goal picker + points per game */
.goalpick{padding:8px 12px;margin:6px 0 0}
.goalpick select{font-weight:600}
.ppg .board{display:flex;align-items:center;gap:14px;margin-top:12px}
.ppg .bn{flex:none;min-width:86px;text-align:center;background:#1f2937;color:#ffd166;border-radius:6px;padding:8px 10px;box-shadow:inset 0 0 0 2px #374151,0 3px 8px #0002;font-family:ui-monospace,Menlo,Consolas,monospace}
.ppg .bn b{display:block;font-size:40px;line-height:1;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.ppg .bn span{font-size:10px;letter-spacing:.2em;color:#fca5a5}
.ppg .bm{flex:1;min-width:0}.ppg .bl{font-size:12px;color:var(--text2);font-weight:600}
.ppg .track.slim{margin:8px 0 6px;height:8px}.ppg .bs{font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.ppg .gt2{font-size:11.5px;color:var(--text3);font-weight:600;margin:14px 0 0;letter-spacing:.04em;text-transform:uppercase}
.cbars.sm{height:64px}.cl.tdy{color:var(--blue);font-weight:700}
/* the rafters */
.rafters{background:linear-gradient(180deg,#27303d 0,#303b4a 100%);color:#e9edf3;overflow:hidden}
.rafters .mh span{color:#9fb0c4}

  var snap={id:uid(),ts:Date.now(),day:today0,logs:S.logs.length,kb:Math.max(1,Math.round(txt.length/1024)),label:label||'auto',data:txt};
  /* one automatic snapshot per day, so a double-finish does not eat your slots */
  if(last&&last.day===today0&&last.label==='auto'&&snap.label==='auto')snaps[snaps.length-1]=snap;else snaps.push(snap);
  trimSnaps(snaps);return storeSnaps(snaps)?snaps.length:0;
}

function plannedSet(){var s={};S.days.forEach(function(d){(d.dow||[]).forEach(function(i){s[i]=1})});return s}  // keys are JS getDay() values
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekDays(offset){var m=monday(new Date());m.setDate(m.getDate()-7*offset);var a=[];for(var i=0;i<7;i++){var d=new Date(m);d.setDate(m.getDate()+i);a.push(d)}return a}
function loggedDateSet(){var s={};S.logs.forEach(function(l){s[l.date]=1});return s}
function weekStats(offset,planned,logged){
  var days=weekDays(offset),n=Object.keys(planned).length,done=0;
  days.forEach(function(d){if(logged[dstr(d)])done++});
  return {days:days,planned:n,done:done,start:days[0]};
}
function weekCardHTML(){
  var planned=plannedSet(),logged=loggedDateSet(),ws=weekStats(0,planned,logged),t0=today(),n=ws.planned;
  var labels=['M','T','W','T','F','S','S'],cells='';
  var doneOnPlanned=0,missedYesterday=false,yest=new Date();yest.setDate(yest.getDate()-1);
  ws.days.forEach(function(d,i){
    var ds=dstr(d),isPlanned=!!planned[d.getDay()],isDone=!!logged[ds],isToday=ds===t0,isPast=ds<t0,cls,glyph='';
    if(isDone){cls='done';glyph='✓';if(isPlanned)doneOnPlanned++}
    else if(isPlanned&&isPast){cls='miss';glyph='–'}
    else if(isPlanned){cls='plan';glyph='•'}
    else{cls='rest';glyph='rest'}
    if(isPlanned&&isPast&&!isDone&&ds===dstr(yest)&&S.logs.length>0)missedYesterday=true;
    cells+='<div class="c '+cls+(isToday?' today':'')+'"><span class="l">'+labels[i]+'</span><div class="dot">'+glyph+'</div></div>';
  });
  var total=ws.done,msg;
  if(!n)msg='Pick weekdays for your workouts in Program and this strip will keep score.';
  else if(doneOnPlanned>=n)msg='Every planned session done this week. That is the whole secret. Go enjoy the weekend.';
  else if(missedYesterday)msg='Missed one? Fine. The rule is simply never miss twice. Today is the comeback.';
  else if(total===0)msg='A blank week is only a blank page. One session starts the streak.';
  else msg=total+' down, '+Math.max(0,n-doneOnPlanned)+' to go. Consistent beats intense, every single time.';
  return '<div class="group week"><div class="wh"><b>This week</b><span>'+total+(n?' of '+n+' planned':' logged')+'</span></div><div class="wk">'+cells+'</div><div class="wm">'+esc(msg)+'</div></div>';
}
function consistencyCard(){
  var planned=plannedSet(),logged=loggedDateSet(),n=Object.keys(planned).length,bars='',pdone=0,pplan=0,first=true;
  for(var o=7;o>=0;o--){
    var ws=weekStats(o,planned,logged),goal=n||Math.max(ws.done,1),ratio=ws.done/goal;
    if(o<4){pdone+=Math.min(ws.done,goal);pplan+=goal}
    var cls=ratio>=1?'full':(ratio>=.5?'part':(ws.done>0?'low':''));
    var hgt=ws.done?Math.max(14,Math.round(ws.done/7*100)):5;
    bars+='<div class="cb"><div class="bar '+cls+'" style="height:'+hgt+'%" title="'+ws.done+' day(s)"></div><span class="cl">'+shortDate(dstr(ws.start))+'</span></div>';
  }
  var pct=pplan?Math.round(pdone/pplan*100):0;
  var tag=!S.logs.length?'Nothing to judge yet. The first week is always the hardest to start.':
    pct>=90?'Elite showing-up skills.':pct>=70?'Strong. This is how people actually change.':pct>=40?'Solid base. One more session a week would make it a habit.':'Plenty of room to grow. Smaller, easier sessions still count.';
  return '<div class="group mcard"><div class="mh"><b>Consistency</b><span>'+(n?pct+'% of planned, last 4 weeks':'last 8 weeks')+'</span></div>'+
    '<div class="cbars">'+bars+'</div><div class="mq">'+esc(tag)+'</div>'+
    '<div class="fine">Taller bar = more training days that week. Teal = you hit your plan.</div></div>';
}

function evalRun(run){

  for(var i=0;i<4;i++){

    var a=dstr(ws),b=dstr(we),dd={};S.logs.forEach(function(l){if(l.date>=a&&l.date<=b)dd[l.date]=1});
    var days=Object.keys(dd).length,ended=b<t0,started=a<=t0,state;
    if(out)state='void';

  if(!sets.length){toast('Enter a weight or reps first');return false}
  var prev=prevLog(ex.name,day.id),existing=loggedToday(day.id,ex.name);

  else S.logs.push({id:uid(),date:ui.date,ts:Date.now(),dayId:day.id,name:ex.name,sets:sets});
  var pr=prev&&(+topSet(sets).w||0)>(+topSet(prev.sets).w||0);
  save();delete ui.draft[id];
  var next=null;for(var i=0;i<day.exercises.length;i++){if(!loggedToday(day.id,day.exercises[i].name)){next=day.exercises[i];break}}

/* streak = consecutive Mon-Sun weeks with at least one logged session, counting back from this week
   (this week may still be empty without breaking the streak) */
function weekKey(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return dstr(x)}
function streakInfo(){
  var weeks={};S.logs.forEach(function(l){weeks[weekKey(parseD(l.date))]=1});
  var cur=new Date(),k=weekKey(cur),n=0;
  if(!weeks[k]){cur.setDate(cur.getDate()-7);k=weekKey(cur)}
  while(weeks[k]){n++;cur.setDate(cur.getDate()-7);k=weekKey(cur)}
  var thisWeek=S.logs.filter(function(l){return weekKey(parseD(l.date))===weekKey(new Date())});
  var days={};thisWeek.forEach(function(l){days[l.date]=1});
  return {weeks:n,days:Object.keys(days).length};
}
function streakHTML(){
  if(ui.tab!=='train'||!S.chosen||!S.logs.length)return '';
  var s=streakInfo();
  if(s.weeks>=2)return '<div class="streak"><i>🔥</i>'+s.weeks+'-week streak · '+s.days+' this week</div>';
  if(s.days>0)return '<div class="streak"><i>🔥</i>'+s.days+' workout'+(s.days===1?'':'s')+' this week</div>';
  return '<div class="streak cold"><i>🔥</i>Start a new streak today</div>';
}

function draftFor(e,day){
  if(!ui.draft[e.id]){

    else{
      var p=prevLog(e.name,day.id),d=[];
      for(var i=0;i<e.sets;i++){var s=p&&p.sets[Math.min(i,p.sets.length-1)];d.push({w:s&&+s.w?String(s.w):'',r:s&&s.r?String(s.r):''})}
      ui.draft[e.id]=d;
    }
  }
  return ui.draft[e.id];
}

  if(justMade){bx=247;by=104}

/* ───────── points per game ───────── */
var PPG_QUIPS=[
 [0,'Scoreboard is blank. Tip-off is whenever you are ready.'],
 [2,'On the board. The crowd politely claps.'],
 [8,'Warming up. The announcer has learned your name.'],
 [14,'Double digits. Opponents are starting to scout you.'],
 [20,'20-point game. Somebody get this player a sports drink.'],
 [30,'30-point game. The bench is on its feet.'],
 [40,'40 points. Please leave some for the other teams.']
];
function ptsByDate(){var m={};S.logs.forEach(function(l){m[l.date]=(m[l.date]||0)+2});return m}
function weekPtsArr(offset,m){m=m||ptsByDate();return weekDays(offset).map(function(d){return m[dstr(d)]||0})}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function weekPtsTotals(){var m={};S.logs.forEach(function(l){var k=weekKey(parseD(l.date));m[k]=(m[k]||0)+2});return m}
function careerHigh(){var m=weekPtsTotals(),h=0;Object.keys(m).forEach(function(k){h=Math.max(h,m[k])});return h}
function potentialPts(){var p=0;S.days.forEach(function(d){p+=d.exercises.length*2*(d.dow||[]).length});return p}
function ppgCard(){
  var m=ptsByDate(),cur=weekPtsArr(0,m),prev=weekPtsArr(1,m),tot=sum(cur),ptot=sum(prev),hi=careerHigh(),t0=today(),days=weekDays(0);
  var wt=weekPtsTotals(),keys=Object.keys(wt),games=keys.length,avg=games?Math.round(sum(keys.map(function(k){return wt[k]}))/games*10)/10:0;
  var pot=potentialPts(),diff=tot-ptot,stat,mood;
  if(!tot&&!ptot){stat='Blank scoreboard';mood='Tip-off is whenever you are ready.'}
  else if(diff>0){stat='Leading by '+diff;mood='You are beating last week. The crowd is on its feet.'}
  else if(diff<0){stat='Trailing by '+(-diff);mood=Math.ceil(-diff/2)+' more exercise'+(Math.ceil(-diff/2)===1?'':'s')+' ties it up. Plenty of time left on the clock.'}
  else{stat='Tied game';mood='Dead even with last week. One more exercise wins it.'}
  var labels=['M','T','W','T','F','S','S'];
  var cols=cur.map(function(v,i){
    var d=days[i],slots=0;S.days.forEach(function(x){if((x.dow||[]).indexOf(d.getDay())>=0)slots+=x.exercises.length});
    var filled=v/2,total=Math.max(slots,filled),show=Math.min(total,8),balls='';
    for(var k=0;k<show;k++)balls+='<i class="sb'+(k<filled?'':' e')+'"></i>';
    var isT=dstr(d)===t0;
    return '<div class="sc'+(isT?' tdy':'')+'"><div class="stack">'+(total>8?'<em>+'+(total-8)+'</em>':'')+balls+'</div><span class="cl">'+labels[i]+'</span><b>'+(v||'·')+'</b></div>'}).join('');
  var W=300,H=70,L=8,R=8,T=8,B=14,series=[];
  for(var o=7;o>=0;o--)series.push(sum(weekPtsArr(o,m)));
  var mx=Math.max(4,Math.max.apply(null,series)),X=function(i){return L+(W-L-R)*i/7},Y=function(v){return T+(H-T-B)*(1-v/mx)};
  var line=series.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ');
  var spark='<svg viewBox="0 0 '+W+' '+H+'" width="100%" class="spark"><defs><linearGradient id="spg" x1="0" x2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#00c2b2"/></linearGradient>'+
    '<linearGradient id="spf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".22"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="M'+X(0)+' '+(H-B)+'L'+line.replace(/ /g,'L')+'L'+X(7)+' '+(H-B)+'Z" fill="url(#spf)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="url(#spg)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    series.map(function(v,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(i===7?4:2.6)+'" fill="'+(i===7?'#00c2b2':'#0a84ff')+'"/>'}).join('')+
    '<text x="'+L+'" y="'+(H-2)+'">8 wks ago</text><text x="'+(W-R)+'" y="'+(H-2)+'" text-anchor="end">this week</text></svg>';
  return '<div class="group mcard marathon ppg"><div class="mh"><b>Points per game</b><span>week of '+shortDate(dstr(days[0]))+'</span></div>'+
    '<div class="jumbo"><div class="jt"><span>YOU</span><b>'+pad2(tot)+'</b></div><div class="jm"><i></i><em>VS</em><i></i></div><div class="jt dim"><span>LAST WK</span><b>'+pad2(ptot)+'</b></div></div>'+
    '<div class="jstat"><b>'+stat+'</b><span>'+esc(mood)+'</span></div>'+
    '<div class="shotlabel"><span>Shot chart</span><span>each ball = 2 pts'+(pot?(tot>pot?' · beat the plan by '+(tot-pot):' · '+tot+' of '+pot+' possible'):'')+'</span></div>'+
    '<div class="shots">'+cols+'</div>'+
    '<div class="mstat"><div><b>'+avg+'</b><span>avg per game</span></div><div><b>'+hi+'</b><span>career high</span></div><div><b>'+games+'</b><span>games played</span></div></div>'+
    '<div class="shotlabel" style="margin-top:14px"><span>Last 8 games</span><span></span></div>'+spark+
    '<div class="fine">Every completed exercise = 2 points. A game runs Monday to Sunday.</div></div>';
}

function recapData(off){
  var days=weekDays(off),wk=dstr(days[0]),logs=S.logs.filter(function(l){return weekKey(parseD(l.date))===wk});
  var dset={},vol=0,byEx={},best=null;

function chart(pts,title){
  if(pts.length<2)return '<div class="empty" style="padding:26px 10px">Log this exercise at least twice to see a trend.</div>';
  var W=340,H=168,L=30,R=8,T=16,B=22;
  var vs=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  if(mn===mx){mn-=1;mx+=1}
  var x=function(i){return L+(W-L-R)*i/(pts.length-1)},y=function(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn))};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%">'+
    '<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#00c2b2"/></linearGradient></defs>'+
    '<text x="'+L+'" y="9">'+esc(title)+'</text>';
  [0,.5,1].forEach(function(f){var v=mn+(mx-mn)*f,yy=y(v);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="0" y="'+(yy+3)+'">'+(Math.round(v*10)/10)+'</text>'});
  s+='<polyline fill="none" stroke="url(#cg)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="'+
     pts.map(function(p,i){return x(i).toFixed(1)+','+y(p.v).toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(p,i){s+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="3" fill="url(#cg)"/>';
    if(i===0||i===pts.length-1||pts.length<=6)s+='<text x="'+(x(i)-9)+'" y="'+(H-6)+'">'+shortDate(p.d)+'</text>'});
  return s+'</svg>';
}

function myExercises(){
  var seen={},out=[];
  S.days.forEach(function(d){d.exercises.forEach(function(e){if(!seen[e.name]){seen[e.name]=1;out.push(e.name)}})});
  S.logs.forEach(function(l){if(!seen[l.name]){seen[l.name]=1;out.push(l.name)}});
  return out.sort();
}
function inProgram(name){
  var hit=false;S.days.forEach(function(d){d.exercises.forEach(function(e){if(e.name===name)hit=true})});
  return hit;
}

app.addEventListener('click',function(e){

  if(e.target.closest('[data-handle]'))return;
  var a=el.dataset.act,id=el.dataset.id,dayId=el.dataset.day;

  if(a==='day'){ui.dayId=id;ui.open=null;ui.draft={};render()}
  else if(a==='toggle'){ui.open=ui.open===id?null:id;render()}
  else if(a==='swap'){
    var x=findEx(id),old=x.name;x.name=el.dataset.name;
    x.alts=[old].concat((x.alts||[]).filter(function(n){return n!==el.dataset.name&&n!==old}));
    var l=libFind(x.name);if(l)x.note=l[3];
    delete ui.draft[id];save();render();
  }
  else if(a==='addset'){var dr=ui.draft[id],last=dr[dr.length-1]||{w:'',r:''};dr.push({w:last.w,r:last.r});render()}
  else if(a==='rmset'){var d2=ui.draft[id];d2.splice(+el.dataset.i,1);if(!d2.length)d2.push({w:'',r:''});render()}
  else if(a==='rest'){startTimer(+el.dataset.s)}
  else if(a==='savelog'){saveExercise(id)}
  else if(a==='dellog'){if(confirm('Delete this entry?')){S.logs=S.logs.filter(function(l){return l.id!==id});ui.draft={};save();render()}}
  else if(a==='openpick'){ui.picker=true;pushState({tab:ui.tab,picker:1});render();window.scrollTo(0,0)}
  else if(a==='closepick'){ui.picker=false;if(history.state&&history.state.picker){try{history.back()}catch(e){}}render()}
  else if(a==='quip'){ui.quip++;render()}
  else if(a==='pview'){S.settings.pview=el.dataset.v;save();render();window.scrollTo(0,0)}
  else if(a==='recapwk'){ui.recapWk=+el.dataset.o;render()}
  else if(a==='sharerecap'){var tx=recapText();if(navigator.share)navigator.share({title:'Court Strength',text:tx}).catch(function(){});else if(navigator.clipboard){navigator.clipboard.writeText(tx);toast('Recap copied')}else toast(tx)}
  else if(a==='banner'){var bb=BANNERS.filter(function(b){return b[0]===el.dataset.id})[0];if(bb)toast((S.banners&&S.banners[bb[0]]?'Raised: ':'Locked: ')+bb[2]+' — '+bb[3])}
  else if(a==='flipcard'){ui.flip=!ui.flip;var pc=document.querySelector('.pcard');if(pc)pc.classList.toggle('flip',ui.flip)}
  else if(a==='keepdec'||a==='keepinc'){
    var nk=Math.min(10,Math.max(1,S.settings.keep+(a==='keepinc'?1:-1)));
    if(nk===S.settings.keep)return;
    var have=loadSnaps().length;
    if(nk<have&&!confirm('Keeping only '+nk+' will delete the '+(have-nk)+' oldest snapshot'+(have-nk===1?'':'s')+'. Continue?'))return;
    S.settings.keep=nk;save();storeSnaps(trimSnaps(loadSnaps()));render();
  }
  else if(a==='togglefile'){S.settings.file=!S.settings.file;save();render()}
  else if(a==='togglesnaps'){ui.snaps=!ui.snaps;render()}
  else if(a==='delsnap'){if(confirm('Delete this snapshot?')){storeSnaps(loadSnaps().filter(function(s){return s.id!==id}));render()}}
  else if(a==='restoresnap'){
    var sn=loadSnaps().filter(function(s){return s.id===id})[0];if(!sn)return;
    if(!confirm('Restore the snapshot from '+fmtWhen(sn.ts)+'?\n\nYour current data is saved as a snapshot first, so you can switch back.'))return;
    try{
      var keepSet=S.settings;takeSnapshot('before-restore');
      var j=JSON.parse(sn.data);j.chosen=true;j.settings=keepSet;if(!j.finished)j.finished={};if(!j.templates)j.templates=[];
      j.days.forEach(function(d){if(!d.dow)d.dow=[]});
      S=j;save();ui.draft={};ui.open=null;ui.edit=null;ui.dayId=matchDay(ui.date);render();toast('Snapshot restored');
    }catch(err){toast('Could not restore that snapshot')}
  }
  else if(a==='finish'){finishWorkout()}
  else if(a==='settpl'){
    var t=tpl(id);
    if(S.chosen&&!confirm('Load the '+t.name+' program?\n\nThis replaces your current workout days. Your logged history is kept.'))return;
    S.program=t.id;S.days=t.build();S.chosen=true;S.name=t.name;
    ui.picker=false;ui.edit=null;ui.draft={};ui.open=null;ui.dayId=matchDay(ui.date);
    save();gotoTab('train');render();window.scrollTo(0,0);toast(t.name+' program loaded');
  }
  else if(a==='savetpl'){
    var cur=tpl(S.program),nm=prompt('Name your new template',(S.name||'My template')+(cur&&cur.user?' copy':''));
    if(nm===null)return;nm=nm.trim();if(!nm){toast('Give it a name first');return}

    S.templates.push(nt);S.program=nt.id;S.name=nm;save();render();toast('Saved “'+nm+'” to My templates');
  }
  else if(a==='updtpl'){
    var ut=S.templates.filter(function(x){return x.id===S.program})[0];if(!ut)return;
    if(!confirm('Overwrite “'+ut.name+'” with your current days and exercises?'))return;
    ut.days=JSON.parse(JSON.stringify(S.days));save();toast('Template updated');
  }
  else if(a==='deltpl'){
    var dt=S.templates.filter(function(x){return x.id===id})[0];if(!dt)return;
    if(!confirm('Delete the template “'+dt.name+'”? Your current workout and history are not affected.'))return;
    S.templates=S.templates.filter(function(x){return x.id!==id});
    if(S.program===id)S.program='custom';
    save();render();toast('Template deleted');
  }

  else if(a==='pickex'){ui.pick={dayId:dayId,exId:id||null};ui.q='';ui.qFocus=false;openModal();render()}
  else if(a==='delex'){if(confirm('Remove this exercise from the day? Logged history is kept.')){
    var dx=dayById(dayId);dx.exercises=dx.exercises.filter(function(q){return q.id!==id});save();render()}}
  else if(a==='mv'){
    var arr=dayById(dayId).exercises,i2=-1;
    arr.forEach(function(q,k){if(q.id===id)i2=k});
    var j=i2+(+el.dataset.dir);
    if(j>=0&&j<arr.length){var tmp=arr[i2];arr[i2]=arr[j];arr[j]=tmp;save();render()}
  }
  else if(a==='addday'){var nd=D('New day',[],[]);S.days.push(nd);ui.edit=nd.id;save();render()}
  else if(a==='delday'){
    if(S.days.length<2){toast('Keep at least one workout day');return}
    if(confirm('Delete this whole day? Logged history is kept.')){
      S.days=S.days.filter(function(q){return q.id!==dayId});ui.edit=null;ui.dayId=matchDay(ui.date);save();render()}}
  else if(a==='export'){backupNow({file:true});toast('Backup downloaded');render()}
  else if(a==='import'){document.getElementById('file').click()}
  else if(a==='reset'){
    if(confirm('Delete all history and start over?\n\nYour saved snapshots stay, so you can still restore from them.')&&confirm('This cannot be undone. Continue?')){
      S=fresh('starter');S.chosen=false;S.templates=[];S.finished={};S.settings={keep:3,file:true,goal:'marathon'};save();
      ui={tab:'program',date:today(),dayId:null,open:null,draft:{},prog:null,edit:null,picker:false,safety:false,pick:null,q:'',celebrated:{},done:null,quip:0};
      ui.dayId=matchDay(ui.date);render();window.scrollTo(0,0);
    }
  }
});

/* ───────── finish workout ───────── */
function finishWorkout(){
  var day=dayById(ui.dayId);if(!day)return;
  var n=doneCount(day),t=day.exercises.length;
  if(n<t&&!confirm('You have logged '+n+' of '+t+' exercises. Finish anyway?\n\nA short workout still beats a skipped one.'))return;
  var first1=!S.finished[ui.date+'|'+day.id];S.finished[ui.date+'|'+day.id]=Date.now();
  var bk=backupNow();                        // snapshot in the app, plus a file if the setting is on
  var drop=first1?dropCard():null;var nb=checkBanners();
  var cnt=workoutCount(),up=RANKS.filter(function(r){return r[0]===cnt&&cnt>0})[0];
  ui.done={dayId:day.id,joke:pickFrom(DONE_JOKES),file:bk.file,kept:bk.kept,keep:bk.keep,rank:up?up[1]:null,three:(cnt>0&&cnt%30===0),marathon:(cnt>0&&cnt%30===0),card:drop?drop.id:null,cardNew:drop?drop.isNew:false,cardCount:drop?drop.count:0,banners:nb.map(function(b){return b[1]+' '+b[2]})};
  openModal();render();confetti();
  if(navigator.vibrate)navigator.vibrate([40,60,40,60,120]);
}
function shareBackup(){
  var f=new File([backupBlobText()],backupName(),{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Court Strength backup'}).catch(function(){});
  else toast('Sharing is not available here');
}

/* ───────── drag to reorder days ───────── */
function wireDrag(){
  var rows=[].slice.call(app.querySelectorAll('.daygroup'));
  rows.forEach(function(row){
    var h=row.querySelector('[data-handle]');
    if(h)h.addEventListener('pointerdown',function(ev){startDrag(ev,row,rows)});
  });
}
function startDrag(ev,row,rows){
  ev.preventDefault();ev.stopPropagation();
  var startY=ev.clientY, from=rows.indexOf(row), to=from;
  var hs=rows.map(function(r){var b=r.getBoundingClientRect();return b.height+14});
  row.classList.add('dragging');
  document.body.style.userSelect='none';
  function shift(){
    rows.forEach(function(r,i){
      if(r===row)return;
      var off=0;
      if(to>from&&i>from&&i<=to)off=-hs[from];
      if(to<from&&i>=to&&i<from)off=hs[from];
      r.style.transform=off?'translateY('+off+'px)':'';
    });
  }
  function move(e){
    var dy=e.clientY-startY,t=from,i,d;
    row.style.transform='translateY('+dy+'px) scale(1.015)';
    if(dy>0){i=from+1;d=dy;while(i<rows.length&&d>hs[i]/2){d-=hs[i];t=i;i++}}
    else{i=from-1;d=-dy;while(i>=0&&d>hs[i]/2){d-=hs[i];t=i;i--}}
    if(t!==to){to=t;shift()}
  }
  function up(){
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    document.body.style.userSelect='';
    rows.forEach(function(r){r.style.transform='';r.classList.remove('dragging')});
    if(to!==from){var d=S.days.splice(from,1)[0];S.days.splice(to,0,d);save();ui.dayId=matchDay(ui.date)}
    render();
  }
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}

/* ───────── rest timer ───────── */
var tmr=null,tEl=document.getElementById('timer');
function startTimer(sec){
  clearInterval(tmr);var end=Date.now()+sec*1000;tEl.classList.add('on');
  var tick=function(){
    var left=Math.ceil((end-Date.now())/1000);
    if(left<=0){clearInterval(tmr);tEl.textContent='Rest done';if(navigator.vibrate)navigator.vibrate([180,90,180]);
      setTimeout(function(){tEl.classList.remove('on')},2500);return}
    tEl.textContent=Math.floor(left/60)+':'+pad(left%60);
  };
  tick();tmr=setInterval(tick,250);
}
tEl.addEventListener('click',function(){clearInterval(tmr);tEl.classList.remove('on')});

if(!S.chosen)ui.tab='program';
render();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
